<style>
:root{
  --wine:#5a1a26;
  --wine-dark:#3d0f19;
  --gold:#a8782f;
  --gold-soft:#e9d9b8;
  --cream:#faf5ec;
  --white:#fff;
  --ink:#2b1d1f;
  --line:#e6dccb;
  --radius:12px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:#fff;line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}

.wrap{width:100%;max-width:420px;margin:0 auto;padding:0 16px}

main{padding:max(22px,env(safe-area-inset-top)) 0 max(40px,env(safe-area-inset-bottom));text-align:center}
.warn{display:inline-block;max-width:94%;background:#e11d2e;color:#fff;font-weight:800;font-size:clamp(17px,5vw,26px);line-height:1.2;letter-spacing:-.01em;padding:12px 18px;border-radius:22px;margin-bottom:20px}

.vsl{width:100%;max-width:360px;margin:0 auto;border-radius:var(--radius);overflow:hidden;background:#000}

.offer{margin-top:30px}
.offer[data-wait]{display:none}
.offer.show{animation:offerIn .9s ease both}
@keyframes offerIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.offer .name{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5b4a4c;margin-bottom:4px}
.offer .once{font-size:14px;color:#6b5a5c;margin:0 0 16px}
.offer .price{font-size:48px;font-weight:800;color:#1b1b1b;letter-spacing:-.03em;line-height:1.1;margin:0 0 4px}
.offer .price small{font-size:22px;font-weight:600;margin-right:4px}

.btn{display:flex;align-items:center;justify-content:center;width:100%;max-width:460px;margin:0 auto;min-height:62px;padding:16px 22px;border-radius:999px;background:#16a34a;color:#fff;font:700 16px/1.25 var(--sans);letter-spacing:.01em;text-decoration:none;text-align:center;transition:background .25s,transform .25s}
.btn:hover{background:#15803d;transform:translateY(-1px)}

.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.38)}50%{box-shadow:0 0 0 12px rgba(22,163,74,0)}}
@media(prefers-reduced-motion:reduce){.offer.show{animation:none}.pulse{animation:none}.btn{transition:none}}

.decline{display:inline-block;margin-top:14px;padding:14px 10px;font-size:13px;color:#7a6a6c;text-decoration:underline;text-underline-offset:3px}
.decline:hover{color:var(--wine)}

<body>

<main>
  <div class="wrap">
    <div class="warn">SEU PEDIDO AINDA NÃO ESTÁ COMPLETO!</div>

    <div class="vsl">
      <vturb-smartplayer id="vid-6ae99d99217265d6b61d0e6a" style="display: block; margin: 0 auto; width: 100%;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 56.25% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>
      <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/4c7359a3-bac4-4084-83d3-061b959e08f4/players/6ae99d99217265d6b61d0e6a/v4/player.js", s.async=!0,document.head.appendChild(s); </script>
    </div>

    <div class="offer" id="offer" data-wait>
      <span class="name">Acelerador de Resultados</span>
      <div class="price"><small>R$</small>37,90</div>
      <p class="once">Pagamento único</p>
      <a class="btn pulse" id="buy" href="#">SIM, QUERO ADICIONAR AO MEU PEDIDO!</a>
      <a class="decline" id="decline" href="#">Não, obrigado. Quero continuar sem essa oferta.</a>
    </div>
  </div>
</main>

<script>
(function(){
  /* CONFIGURAR ANTES DE PUBLICAR */
  var UPSELL_URL  = ""; /* checkout real do Acelerador de Resultados */
  var DECLINE_URL = ""; /* página de conclusão / acesso à compra original */

  /* Segundo do vídeo em que a oferta aparece: (segundo em que ela fala o preço) - 5 */
  var OFFER_REVEAL_TIME = 60;

  var PLAYER_ID = "vid-6ae99d99217265d6b61d0e6a";

  function setLink(id,url){var a=document.getElementById(id);if(url){a.href=url}else{a.addEventListener("click",function(e){e.preventDefault()})}}
  setLink("buy",UPSELL_URL);
  setLink("decline",DECLINE_URL);

  var offer=document.getElementById("offer");
  var shown=false;
  function reveal(){
    if(shown)return;
    shown=true;
    offer.removeAttribute("data-wait");
    offer.classList.add("show");
  }

  /* Lê o tempo real de reprodução do player Vturb (nunca o tempo na página) */
  function attach(p){
    function check(){
      var t=p&&p.video&&p.video.currentTime;
      if(typeof t==="number"&&t>=OFFER_REVEAL_TIME)reveal();
    }
    p.on("timeupdate",check);
    try{p.on("ended",reveal)}catch(e){}
    check();
  }
  function find(){
    var sp=window.smartplayer,list=sp&&sp.instances;
    if(!list)return null;
    if(list[PLAYER_ID])return list[PLAYER_ID];
    for(var k in list){if(list[k]&&typeof list[k].on==="function")return list[k]}
    return null;
  }
  var tries=0,wait=setInterval(function(){
    var p=find();
    if(p){clearInterval(wait);attach(p)}
    else if(++tries>200)clearInterval(wait);
  },100);
})();
</script>
